spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: file-transfer-backend

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  cors:
    allowed-origins:
      - http://localhost:4200
      - ${APP_CORS_LAN_ORIGIN:http://localhost:4200}
  storage:
    path: ${java.io.tmpdir}/file-transfer
