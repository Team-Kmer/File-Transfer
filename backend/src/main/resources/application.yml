spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: file-transfer-backend

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  cors:
    allowed-origins:
      - http://localhost:4200
      - ${APP_CORS_LAN_ORIGIN:http://localhost:4200}
  storage:
    path: ${java.io.tmpdir}/file-transfer
  rooms:
    ttl: 24h
    chunk-size: 5MB
    max-file-size: 2GB
    blocked-extensions: exe, msi, bat, cmd, com, scr, pif, ps1, vbs, jar, sh, dll
