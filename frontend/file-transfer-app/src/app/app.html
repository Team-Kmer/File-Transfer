<div class="main">
  <div class="content">
    <h1 class="text-4xl font-bold text-blue-600">File Transfer</h1>
    <h2 class="sub-title">This app makes it easier to transfer files between two devices on a LAN. </h2>
  </div>
  <button mat-button (click)="checkHealth()" [disabled]="loading()">
    Check backend health
  </button>

  @if (loading()) {
    <p>Loading…</p>
  }
  @if (status(); as status) {
    <p class="text-green-600">Backend status: {{ status.status }}</p>
  }
  @if (error(); as error) {
    <p class="text-red-600">{{ error.message }}</p>
  }
</div>
