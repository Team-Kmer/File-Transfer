@for (uploadedFile of uploadedFiles(); track uploadedFile.name) {
  <div class="success">

    <div class="success-content">
      <div class="file-marker">
        <mat-icon class="file-marker-icon">file_present</mat-icon>
        <span class="file-extension">{{ sendHandlerService.getFileExtension(uploadedFile.name) }} </span>
      </div>
      <div class="metadata">
        <div class="file-name">{{ uploadedFile.name }}</div>
        <div>{{ getFileType(uploadedFile, uploadedFile.name) }}· {{ getFileSize(uploadedFile) }}
        </div>
      </div>
    </div>

    <div class="success-message">
      <mat-icon>check_circle</mat-icon>
      <span>Sent</span>
    </div>
  </div>
}
